# Fly.io app config. Deploy with `fly launch --no-deploy` once to create the
# app (it will offer to overwrite this file - decline, or diff afterwards),
# then `fly deploy` by hand or via the GitHub Actions workflow at
# .github/workflows/deploy-backend.yml. See ../DEPLOY.md for the full setup.

app = "oauth-launchpad-api" # must be globally unique on Fly - change this
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "oauth_launchpad_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
